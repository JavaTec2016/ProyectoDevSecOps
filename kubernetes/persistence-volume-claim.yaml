apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  # minikube's default StorageClass ("standard") provisions the volume dynamically
  resources:
    requests:
      storage: 5Gi
