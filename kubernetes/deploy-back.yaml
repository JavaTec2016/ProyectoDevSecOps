apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  selector:
   matchLabels:
    app: backend
  replicas: 3
  template:
    metadata:
      labels:
        app: backend
    spec:
      # esperar a que prenda el miscle
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done']
      containers:
        - name: backend
          image: javatec2016/api:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: backendport
          # env pa no batallar con archivos adentro de la imagen
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: secret-mysql, key: MYSQL_DATABASE }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: secret-mysql, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: secret-mysql, key: MYSQL_PASSWORD }
            #De donde sale el frontend en el cluster (no el localhost)
            - name: PROD_ORIGIN
              value: "http://192.168.58.2:30080"
          # checar q si jala el backend
          readinessProbe:
            tcpSocket:
              port: backendport
            initialDelaySeconds: 10
            periodSeconds: 5